[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jflows-md"
version = "0.5.3"
description = "Mixed-domain molecular potentials, flows, and samplers for jflows."
readme = "README.md"
authors = [{ name = "Xuda", email = "abneryepku@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "normalizing-flows",
    "boltzmann-generator",
    "molecular-dynamics",
    "jax",
    "openmm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jflows>=0.5.3",
    "jax>=0.6.0",
    "equinox>=0.13.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
openmm = [
    "openmm>=8.5.0",
]
bundles = [
    "openmm>=8.5.0",
    "parmed>=4.3.1",
    "ambertools-unofficial>=26.0.0",
]

[project.urls]
Homepage = "https://github.com/xuda-ye-math/jflows_md"
Repository = "https://github.com/xuda-ye-math/jflows_md"

[tool.setuptools.packages.find]
include = ["jflows_md*"]
